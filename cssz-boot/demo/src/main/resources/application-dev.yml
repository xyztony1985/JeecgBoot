spring:
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: @config.server-addr@
        group: LOCAL_DEV
        namespace: @config.namespace@
        username: @config.username@
        password: @config.password@
      discovery:
        enabled: false
        server-addr: ${spring.cloud.nacos.config.server-addr}
        group: auto_host_${COMPUTERNAME:${HOSTNAME:unknown}}
        namespace: ${spring.cloud.nacos.config.namespace}
        username: @config.username@
        password: @config.password@
  config:
    import:
      # - nacos:infra.yml
      # - nacos:jeecg.yml
      # - optional:nacos:biz-main-app.yml
      - optional:classpath:config/infra.yml
      - optional:classpath:config/jeecg.yml
